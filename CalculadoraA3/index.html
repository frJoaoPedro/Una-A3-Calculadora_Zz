<!DOCTYPE html>

<html lang="pt-br">
    
<head>
    
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>calculadora</title>
   
    <style>
        body {
    background-color: #e60012;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: Impact, "Arial Black", sans-serif;
}


   button {
    width: 60px;
    height: 60px;
    background-color: #fff;
    color: #000;
    font-family: inherit;
    font-size: 30px;
    border: none;
    cursor: pointer;
    transform: skew(-8deg);
}

   button:hover {
    background-color: #e60012;
    color: #fff;
    transform: skew(-8deg) scale(1.1);
   }
   

#calculadora {
    position: relative;
    background-color: #000;
    padding: 20px;
    transform: rotate(-3deg);
}
   #teclado{

    display: grid;
    grid-template-columns: repeat(4, 60px);
    gap: 10px;

   }
  #visor {
    background-color: #fff;
    color: #000;
    width: 270px;
    height: 50px;
    font-size: 28px;
    text-align: right;
    box-sizing: border-box;
    margin-bottom: 10px;
    border: none;
    transform: skew(-8deg);
    box-shadow: 6px 6px 0 #e60012;
    }
    #calculadora::before {
    content: "★";
    position: absolute;
    top: -35px;
    right: -25px;
    font-size: 70px;
    color: #fff;
}
#calculadora::after {
    content: "★";
    position: absolute;
    bottom: -30px;
    left: -20px;
    font-size: 50px;
    color: #000;
}

#igual {
    grid-column: span 4;
    width: 100%;
    background-color: #e60012;
    color: #fff;
}

#igual:hover {
    background-color: #000;
    color: #fff;
}

</style>

</head>

<body>
    <div id = "calculadora">
   
    <input type="text" id="visor" disabled>
    
    <div id = "teclado">
    <button onclick="limpar('C')">C</button> <button onclick="apagar('⌫')">⌫</button> <button onclick="adicionar('%')">%</button> <button onclick="adicionar('÷')">÷</button>
    <button onclick="adicionar(1)">1</button> <button onclick="adicionar(2)">2</button> <button onclick="adicionar(3)">3</button> <button onclick="adicionar('x')">x</button>
    <button onclick="adicionar (4)">4</button> <button onclick = "adicionar(5)">5</button> <button onclick="adicionar (6)">6</button> <button onclick="adicionar ('-')">-</button>
    <button onclick=" adicionar (7)">7</button> <button onclick = "adicionar (8)">8</button> <button onclick = "adicionar (9)">9</button> <button onclick = "adicionar ('+')">+</button> 
    <button onclick=" adicionar ('()')">()</button> <button onclick = " adicionar (0)">0</button> <button onclick = " adicionar (',')">,</button> <button id ="igual" onclick = " calcular ('=')">=</button>

        </div>
    </div>

    <Script src="script.js"></Script>
</body>

</html>
